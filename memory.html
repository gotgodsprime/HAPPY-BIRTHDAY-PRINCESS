<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin:0; background:black; color:white; height:100vh; overflow:hidden; font-family:serif; transition: opacity 1s; }
        .bg { position:fixed; inset:-5%; background:url('princess.jpg') center/cover; filter: blur(40px) brightness(0.3); z-index:-1; transition: filter 2s ease; }
        #content { height:100%; display:flex; justify-content:center; align-items:center; text-align:center; padding: 30px; }
        .line { font-size: 1.3rem; line-height: 1.8; opacity: 0; transition: opacity 1s; }
        .line.active { opacity: 1; }
        .hint { position: fixed; bottom: 10%; width: 100%; text-align: center; font-size: 0.7rem; opacity: 0.3; letter-spacing: 2px; }
    </style>
</head>
<body onclick="next()">
    <div class="bg" id="bg"></div>
    <div id="content"><div class="line" id="text"></div></div>
    <div class="hint">TAP TO CONTINUE</div>
<script>
    const lines = ["It started as a whisper...", "A connection I didn't see coming.", "Then it became the soundtrack to my days.", "Your laugh.", "Your perspective.", "Life moves forward, and things change...", "But you are etched into the story.", "And stories like ours... they don't just disappear."];
    let cur = 0;
    function next() {
        const el = document.getElementById("text");
        if(cur < lines.length) {
            el.classList.remove("active");
            document.getElementById("bg").style.filter = `blur(${Math.random()*20 + 20}px) brightness(0.3)`;
            setTimeout(() => { el.innerHTML = lines[cur]; el.classList.add("active"); cur++; }, 800);
        } else {
            document.body.style.opacity = "0";
            setTimeout(() => window.location.href="secret.html", 1000);
        }
    }
    next();
</script>
</body>
</html>
