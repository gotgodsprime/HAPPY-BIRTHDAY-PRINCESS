<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; background: #000; color: white; height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; font-family: serif; }
        .bg { position: fixed; inset: 0; background: url('princess.jpg') center/cover; filter: blur(30px) brightness(0.2); z-index: -1; }
        .text { font-size: 1.4rem; padding: 20px; transition: opacity 0.5s; }
    </style>
</head>
<body onclick="move()">
    <div class="bg"></div>
    <div id="msg" class="text">Tap to read memories...</div>

<script>
    const m = ["You were a whisper in the wind...", "A laugh that stayed in my head.", "Distance is just a test.", "And you passed."];
    let i = 0;
    function move() {
        if(i < m.length) {
            document.getElementById('msg').style.opacity = 0;
            setTimeout(() => {
                document.getElementById('msg').innerHTML = m[i];
                document.getElementById('msg').style.opacity = 1;
                i++;
            }, 500);
        } else {
            window.location.replace("secret.html");
        }
    }
</script>
</body>
</html>
