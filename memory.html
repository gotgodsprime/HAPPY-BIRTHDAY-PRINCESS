<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memories</title>
<style>
  body { margin: 0; background: #000; color: white; height: 100vh; display: flex; justify-content: center; align-items: center; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
  #text-container { width: 80%; max-width: 500px; text-align: center; }
  #text { font-size: 1.2rem; line-height: 1.8; font-weight: 300; transition: opacity 0.5s; }
  .hint { position: fixed; bottom: 30px; opacity: 0.3; font-size: 0.8rem; letter-spacing: 2px; }
</style>
</head>
<body onclick="nextStep()">

<audio id="music" loop><source src="song.mp3" type="audio/mpeg"></audio>

<div id="text-container">
  <p id="text"></p>
</div>

<div class="hint">TAP TO CONTINUE</div>

<script>
  const lines = [
    "It wasn’t supposed to be anything serious…",
    "Just two people… existing in the same space.",
    "But somehow… it became something more.",
    "You became familiar. Comforting. Important.",
    "And even when things changed…",
    "That doesn’t erase what it was.",
    "Some connections don’t need noise…",
    "They just exist."
  ];

  let step = 0;
  const audio = document.getElementById("music");

  window.addEventListener('load', () => {
    const savedTime = localStorage.getItem('musicTime');
    if(savedTime) audio.currentTime = savedTime;
    audio.play();
    nextStep(); 
  });

  function nextStep() {
    if(step < lines.length) {
      const el = document.getElementById("text");
      el.style.opacity = 0;
      setTimeout(() => {
        el.innerText = lines[step];
        el.style.opacity = 1;
        step++;
      }, 500);
    } else {
      localStorage.setItem('musicTime', audio.currentTime);
      document.body.style.opacity = 0;
      setTimeout(() => { window.location.href = "secret.html"; }, 1000);
    }
  }
</script>
</body>
</html>
