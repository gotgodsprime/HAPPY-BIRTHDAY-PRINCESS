<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;400&display=swap" rel="stylesheet">
<style>
  body { 
    margin: 0; background: #000; color: white; height: 100vh; 
    display: flex; justify-content: center; align-items: center; 
    font-family: 'Montserrat', sans-serif; overflow: hidden; 
  }

  /* Optimized Background: Hardware accelerated to prevent glitches */
  .bg-memory {
    position: fixed; inset: 0;
    background: url('princess.jpg') center/cover no-repeat;
    filter: blur(40px) brightness(0.2);
    z-index: -1;
    transform: translateZ(0); /* Forces GPU rendering */
    will-change: transform;
  }

  #text-container {
    width: 85%; max-width: 600px; text-align: center;
    min-height: 150px; display: flex; align-items: center; justify-content: center;
  }

  #text { 
    font-size: 1.2rem; line-height: 2; font-weight: 200; 
    letter-spacing: 1px; transition: opacity 0.6s ease; 
  }

  .hint { 
    position: fixed; bottom: 40px; opacity: 0.4; 
    font-size: 0.7rem; letter-spacing: 3px; text-transform: uppercase;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 0.2; } 50% { opacity: 0.5; } }
</style>
</head>
<body onclick="nextStep()">

<div class="bg-memory"></div>
<audio id="music" loop><source src="song.mp3" type="audio/mpeg"></audio>

<div id="text-container">
  <p id="text"></p>
</div>
<div class="hint">Tap to continue</div>

<script>
  const lines = [
    "It wasn’t supposed to be serious...",
    "But you became familiar.",
    "Important.",
    "And even if things changed...",
    "The memory remains.",
    "I just didn't want today to pass...",
    "...without acknowledging you."
  ];

  let step = 0;
  let isTransitioning = false;
  const audio = document.getElementById("music");

  // STABILIZED AUDIO RESUME
  function startSequence() {
    const savedTime = localStorage.getItem('musicTime');
    if (savedTime) {
      audio.currentTime = parseFloat(savedTime);
    }
    
    // Play with a fail-safe
    const playPromise = audio.play();
    if (playPromise !== undefined) {
      playPromise.catch(() => {
        console.log("Waiting for user tap to play music");
      });
    }
    nextStep();
  }

  window.onload = startSequence;

  function nextStep() {
    if (isTransitioning) return;
    
    const el = document.getElementById("text");
    
    if (step < lines.length) {
      isTransitioning = true;
      el.style.opacity = 0;
      
      setTimeout(() => { 
        el.innerText = lines[step]; 
        el.style.opacity = 1; 
        step++; 
        isTransitioning = false;
        // Keep syncing time
        localStorage.setItem('musicTime', audio.currentTime);
      }, 600);
      
    } else {
      // Transition to Secret Page
      localStorage.setItem('musicTime', audio.currentTime);
      document.body.style.transition = "opacity 1.5s ease";
      document.body.style.opacity = "0";
      setTimeout(() => { window.location.href = "secret.html"; }, 1500);
    }
  }

  // Sync music time every second just in case of a crash
  setInterval(() => {
    if (!audio.paused) {
      localStorage.setItem('musicTime', audio.currentTime);
    }
  }, 1000);
</script>
</body>
</html>
