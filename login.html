<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; background: #000; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; text-align: center; }
        .bg { position: fixed; inset: 0; background: url('princess.jpg') center/cover; filter: blur(20px) brightness(0.3); z-index: -1; }
        input { background: rgba(255,255,255,0.1); border: 1px solid white; color: white; padding: 15px; border-radius: 25px; width: 200px; text-align: center; outline: none; }
        button { background: white; color: black; border: none; padding: 10px 30px; border-radius: 25px; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="bg"></div>
    <audio id="song" loop><source src="song.mp3"></audio>
    <div>
        <h1 style="letter-spacing: 5px; font-weight: 200;">PRINCESS</h1>
        <input type="text" id="pw" placeholder="Enter Password">
        <br>
        <button type="button" onclick="go()">ENTER</button>
    </div>

<script>
    function go() {
        const p = document.getElementById('pw').value.toLowerCase().trim();
        if(p === "princess") {
            try { document.getElementById('song').play(); } catch(e) {}
            window.location.replace("memory.html");
        } else {
            alert("Wrong password");
        }
    }
</script>
</body>
</html>
