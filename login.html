<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; background: #0b0b14; height: 100vh; overflow: hidden; font-family: sans-serif; transition: background 2s ease; }
        .bg { position: fixed; inset: -10%; background: url('princess.jpg') center/cover; filter: blur(25px) brightness(0.4); z-index: -1; }
        .container { text-align: center; color: white; width: 100%; margin-top: 35vh; }
        input { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); padding: 15px; border-radius: 30px; color: white; text-align: center; backdrop-filter: blur(10px); width: 220px; outline: none; margin-top: 20px; }
        button { margin-top: 15px; background: none; border: 1px solid rgba(255,255,255,0.4); color: white; padding: 10px 30px; border-radius: 30px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="bg"></div>
    <audio id="music" loop><source src="song.mp3"></audio>
    <div class="container">
        <h1 style="font-weight: 200; letter-spacing: 5px;">PRINCESS</h1>
        <p id="typing" style="opacity: 0.6;"></p>
        <div id="ui" style="display:none;">
            <input id="pw" type="text" placeholder="Identity Verified?">
            <br>
            <button onclick="check()">Enter</button>
        </div>
    </div>
<script>
    const msg = "The world is ready when you are.";
    let i = 0;
    function type() {
        if(i < msg.length) {
            document.getElementById("typing").innerHTML += msg.charAt(i);
            i++; setTimeout(type, 50);
        } else { document.getElementById("ui").style.display = "block"; }
    }
    setTimeout(type, 1000);

    function check() {
        const music = document.getElementById("music");
        if(document.getElementById("pw").value.toLowerCase() === "princess") {
            music.play().then(() => {
                document.body.style.opacity = "0";
                setTimeout(() => window.location.href="memory.html", 1000);
            }).catch(() => { window.location.href="memory.html"; });
        }
    }
</script>
</body>
</html>
