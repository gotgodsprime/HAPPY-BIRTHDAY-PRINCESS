<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@200;400&display=swap" rel="stylesheet">
<style>
  body { 
    margin: 0; background: #000; color: #fff; 
    font-family: 'Montserrat', sans-serif; overflow: hidden; 
    display: flex; justify-content: center; align-items: center; height: 100vh; 
  }

  /* The Reveal Animation */
  .bg-reveal { 
    position: fixed; inset: 0; 
    background: url('princess.jpg') center/cover no-repeat;
    filter: blur(40px) brightness(0.15); /* Starts like memory.html */
    z-index: -1;
    animation: clarify 6s cubic-bezier(0.4, 0, 0.2, 1) forwards; 
  }

  @keyframes clarify { 
    to { filter: blur(0px) brightness(0.7); } /* Becomes clear and bright */
  }

  .msg-box { 
    text-align: center; opacity: 0; 
    animation: fadeIn 3s forwards 4s; 
    padding: 30px; border-radius: 20px;
    background: rgba(0,0,0,0.3);
    backdrop-filter: blur(5px);
    max-width: 80%;
  }

  @keyframes fadeIn { to { opacity: 1; } }

  p { line-height: 2; font-weight: 200; letter-spacing: 0.5px; }

  button { 
    background: white; border: none; padding: 12px 30px; 
    border-radius: 30px; margin-top: 25px; cursor: pointer; 
    font-family: 'Montserrat', sans-serif; font-weight: 400; 
    text-transform: uppercase; font-size: 0.7rem; letter-spacing: 2px;
  }
</style>
</head>
<body>

<div class="bg-reveal"></div>
<audio id="music" loop><source src="song.mp3" type="audio/mpeg"></audio>

<div class="msg-box">
  <p>I hope life is treating you with the kindness you deserve. Some things are never loud, but they are always real.</p>
  <button onclick="goFinal()">Continue</button>
</div>

<script>
  const audio = document.getElementById("music");
  window.onload = () => {
    audio.currentTime = localStorage.getItem('musicTime') || 0;
    audio.play();
  };

  function goFinal() {
    localStorage.setItem('musicTime', audio.currentTime);
    document.body.style.transition = "opacity 1s";
    document.body.style.opacity = "0";
    setTimeout(() => { window.location.href = "birthday.html"; }, 1000);
  }
</script>
</body>
</html>
