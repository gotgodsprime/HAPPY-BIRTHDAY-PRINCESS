<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; background: #000; color: white; height: 100vh; display: flex; align-items: center; justify-content: center; font-family: sans-serif; }
        .bg { position: fixed; inset: 0; background: url('princess.jpg') center/cover; filter: brightness(0.5); z-index: -1; animation: focus 5s forwards; }
        @keyframes focus { from { filter: blur(10px) brightness(0.4); } to { filter: blur(0px) brightness(0.6); } }
        .box { background: rgba(0,0,0,0.7); padding: 30px; border-radius: 10px; width: 80%; text-align: center; }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="box">
        <h2>Happy Birthday</h2>
        <p>You matter more than the silence between us. I hope today is perfect.</p>
        <button onclick="document.body.style.display='none'">End</button>
    </div>
</body>
</html>
