<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin:0; background:black; color:white; height:100vh; overflow:hidden; font-family:sans-serif; transition: opacity 3s; }
        .bg { position:fixed; inset:0; background:url('princess.jpg') center/cover; filter: blur(10px) brightness(0.5); z-index:-1; animation: focusIn 8s forwards; }
        @keyframes focusIn { to { filter: blur(2px) brightness(0.6); } }
        .card { position:absolute; bottom: 10%; left:5%; width:90%; opacity:0; animation: slideUp 2s ease 2s forwards; }
        @keyframes slideUp { to { opacity:1; transform:translateY(-20px); } }
        button { background:none; border:1px solid white; color:white; padding:10px 20px; border-radius:20px; margin-top:20px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="bg"></div>
    <div class="card">
        <h2>Happy Birthday, Princess.</h2>
        <p>I’m not trying to rewind the clock... I just believe that when someone matters, you don't let their day go by in silence. I hope you’re happy. I hope today is beautiful.</p>
        <button onclick="finalExit()">End Experience</button>
    </div>
<script>
    function finalExit() {
        document.body.style.opacity = "0";
        setTimeout(() => { document.body.innerHTML = "<div style='color:white; display:flex; justify-content:center; align-items:center; height:100vh; font-style:italic;'>The End.</div>"; document.body.style.opacity = "1"; }, 3000);
    }
</script>
</body>
</html>
