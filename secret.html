<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { margin: 0; background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
  .bg-final { position: fixed; inset: 0; background: url('princess.jpg') center/cover no-repeat; filter: blur(25px) brightness(0.1); z-index: -1; animation: clarify 7s forwards; }
  @keyframes clarify { to { filter: blur(0px) brightness(0.7); } }
  .msg { text-align: center; opacity: 0; animation: fadeIn 3s forwards 4s; backdrop-filter: blur(5px); padding: 20px; border-radius: 15px; }
  @keyframes fadeIn { to { opacity: 1; } }
  button { background: white; border: none; padding: 10px 25px; border-radius: 20px; margin-top: 20px; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>
<div class="bg-final"></div>
<audio id="music" loop><source src="song.mp3" type="audio/mpeg"></audio>

<div class="msg">
  <p>I hope life is treating you with the kindness you deserve.</p>
  <button onclick="goFinal()">Next</button>
</div>

<script>
  const audio = document.getElementById("music");
  window.onload = () => {
    audio.currentTime = localStorage.getItem('musicTime') || 0;
    audio.play();
  };
  function goFinal() {
    localStorage.setItem('musicTime', audio.currentTime);
    window.location.href = "birthday.html";
  }
</script>
</body>
</html>
