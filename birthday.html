<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Montserrat:wght@200;400&display=swap" rel="stylesheet">
<style>
  body { 
    margin: 0; background: #000; color: white; height: 100vh; 
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: 'Montserrat', sans-serif; overflow: hidden;
  }

  /* The Text Glow */
  h1 { 
    font-family: 'Cinzel', serif; font-size: 2.5rem; text-align: center;
    z-index: 10; margin: 0; font-weight: 700;
    text-shadow: 0 0 20px rgba(255,255,255,0.8), 0 0 40px rgba(255,255,255,0.4);
    animation: pulse 3s infinite alternate;
  }
  @keyframes pulse { from { opacity: 0.8; transform: scale(0.98); } to { opacity: 1; transform: scale(1.02); } }

  /* Floating Hearts - Premium Version */
  .heart { 
    position: absolute; color: rgba(255, 45, 85, 0.6); 
    animation: floatUp 5s linear forwards; 
    filter: blur(1px); z-index: 5; 
  }
  @keyframes floatUp { 
    0% { transform: translateY(110vh) rotate(0deg); opacity: 0; } 
    20% { opacity: 1; }
    100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; } 
  }

  /* Canvas for high-end fireworks */
  canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
</style>
</head>
<body>

<audio id="music" loop><source src="song.mp3" type="audio/mpeg"></audio>
<canvas id="fireworksCanvas"></canvas>

<h1>HAPPY BIRTHDAY,<br>PRINCESS 🎉</h1>
<p style="z-index: 10; font-weight: 200; letter-spacing: 3px; margin-top: 20px; opacity: 0.6;">Today is all yours.</p>

<script>
  // Resume Music
  const audio = document.getElementById("music");
  window.onload = () => {
    audio.currentTime = localStorage.getItem('musicTime') || 0;
    audio.play();
    initFireworks();
    setInterval(createHeart, 400);
  };

  function createHeart() {
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.innerHTML = '❤️';
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.fontSize = (Math.random() * 15 + 10) + 'px';
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 5000);
  }

  // Premium Fireworks Engine
  function initFireworks() {
    const canvas = document.getElementById('fireworksCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let particles = [];

    class Particle {
      constructor(x, y, color) {
        this.x = x; this.y = y; this.color = color;
        this.velocity = { x: (Math.random() - 0.5) * 8, y: (Math.random() - 0.5) * 8 };
        this.alpha = 1;
        this.friction = 0.95;
      }
      draw() {
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
      }
      update() {
        this.velocity.x *= this.friction;
        this.velocity.y *= this.friction;
        this.x += this.velocity.x;
        this.y += this.velocity.y;
        this.alpha -= 0.01;
      }
    }

    function createExplosion() {
      const x = Math.random() * canvas.width;
      const y = Math.random() * canvas.height * 0.5;
      const color = `hsl(${Math.random() * 360}, 50%, 50%)`;
      for (let i = 0; i < 40; i++) {
        particles.push(new Particle(x, y, color));
      }
    }

    function animate() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p, i) => {
        if (p.alpha > 0) { p.update(); p.draw(); } 
        else { particles.splice(i, 1); }
      });
      requestAnimationFrame(animate);
    }

    setInterval(createExplosion, 1000);
    animate();
  }
</script>
</body>
</html>
