<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You</title>
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #d1d1d1;
            --accent: #5e5e5e;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Georgia', serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Cinematic Background Slideshow */
        .slideshow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            filter: grayscale(40%) brightness(0.6);
            transition: opacity 3s ease-in-out, transform 10s linear;
        }

        .slide.active {
            opacity: 1;
            transform: scale(1.1);
        }

        /* Overlay Content */
        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            max-width: 600px;
            padding: 20px;
        }

        h1 {
            font-weight: 300;
            letter-spacing: 4px;
            opacity: 0;
            animation: fadeIn 4s forwards 1s;
        }

        p {
            line-height: 1.8;
            font-style: italic;
            opacity: 0;
            animation: fadeIn 4s forwards 3s;
        }

        /* The Hidden Message */
        .secret-trigger {
            margin-top: 50px;
            cursor: pointer;
            font-size: 0.8rem;
            color: #222; /* Barely visible */
            transition: color 1s;
            user-select: none;
        }

        .secret-trigger:hover {
            color: #444;
        }

        #hidden-note {
            display: none;
            font-size: 0.9rem;
            color: var(--accent);
            margin-top: 20px;
            border-top: 1px solid #333;
            padding-top: 10px;
        }

        /* Music Toggle */
        #music-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: none;
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 5px 10px;
            cursor: pointer;
            z-index: 10;
        }

        @keyframes fadeIn {
            to { opacity: 0.7; }
        }
    </style>
</head>
<body>

    <div class="slideshow">
        <!-- REPLACE THESE URLS WITH YOUR ACTUAL IMAGE LINKS -->
        <div class="slide active" style="background-image: url('https://images.unsplash.com/photo-1501901642052-9621bf9923e2?q=80&w=2070');"></div>
        <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1494972308805-463bc619d34e?q=80&w=2073');"></div>
        <div class="slide" style="background-image: url('https://images.unsplash.com/photo-1475483768296-6163e08872a1?q=80&w=2070');"></div>
    </div>

    <div class="content">
        <h1>MAY 13</h1>
        <p>Time moves differently when we're looking back. <br> 
           I hope your day is as quiet and beautiful as the memories I still keep.</p>
        
        <div class="secret-trigger" onclick="revealNote()">...</div>
        <div id="hidden-note">I still look for your light in every room. Happy Birthday.</div>
    </div>

    <button id="music-btn" onclick="toggleMusic()">Play Audio</button>
    
    <!-- REPLACE THIS WITH A DIRECT LINK TO AN MP3 (Google Drive direct link or hosted file) -->
    <audio id="bg-music" loop>
        <source src="https://www.chosic.com/wp-content/uploads/2021/04/Rainy-Day.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Slideshow Logic
        const slides = document.querySelectorAll('.slide');
        let currentSlide = 0;

        function nextSlide() {
            slides[currentSlide].classList.remove('active');
            currentSlide = (currentSlide + 1) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        setInterval(nextSlide, 6000);

        // Music Logic
        const music = document.getElementById('bg-music');
        const btn = document.getElementById('music-btn');

        function toggleMusic() {
            if (music.paused) {
                music.play();
                btn.innerText = "Mute";
            } else {
                music.pause();
                btn.innerText = "Play Audio";
            }
        }

        // Hidden Message Logic
        function revealNote() {
            const note = document.getElementById('hidden-note');
            note.style.display = 'block';
        }
    </script>
</body>
</html>
