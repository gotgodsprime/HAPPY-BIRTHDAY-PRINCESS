<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>For Princess</title>
    
    <!-- PWA / iOS Web App Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --ios-blue: #007aff;
            --bg-dark: #000000;
            --card-dark: #1c1c1e;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-dark);
            color: white;
            overflow: hidden;
            height: 100vh;
        }

        /* Status Bar Simulation */
        #statusBar {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 8px 20px;
            box-sizing: border-box;
            font-size: 13px;
            font-weight: 600;
            z-index: 10000;
        }

        /* Notification Styling */
        #notification {
            position: fixed;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            background: rgba(28, 28, 30, 0.9);
            backdrop-filter: blur(20px);
            padding: 15px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 9999;
            cursor: pointer;
            animation: slideDown 0.5s ease-out;
        }

        @keyframes slideDown {
            from { transform: translate(-50%, -100px); }
            to { transform: translate(-50%, 0); }
        }

        /* Screens */
        .screen {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }

        #lock {
            background: url('photos/lock.jpg') center/cover no-repeat;
            display: block; /* Initial screen */
        }

        #passcode {
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(15px);
        }

        #keys {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            gap: 20px;
            margin-top: 30px;
        }

        .key {
            width: 80px; height: 80px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        /* Chat Interface */
        #chat {
            flex-direction: column;
            padding: 60px 20px 20px;
            overflow-y: auto;
        }

        .bubble {
            padding: 10px 16px;
            border-radius: 20px;
            margin: 4px 0;
            max-width: 75%;
            font-size: 16px;
            line-height: 1.4;
        }

        .sent {
            background: var(--ios-blue);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        /* Typing Dots */
        .typing {
            display: flex; gap: 4px; padding: 10px; align-self: flex-start;
        }
        .dot { width: 6px; height: 6px; background: #8e8e93; border-radius: 50%; animation: blink 1.4s infinite; }
        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        /* Secret Input */
        #nameInput {
            background: transparent;
            border: none;
            border-bottom: 1px solid white;
            color: white;
            text-align: center;
            font-size: 18px;
            outline: none;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div id="statusBar">
    <span id="time">9:41</span>
    <span id="battery">100% 🔋</span>
</div>

<div id="notification">
    <div style="background:var(--ios-blue); width:30px; height:30px; border-radius:7px; display:flex; justify-content:center; align-items:center;">💬</div>
    <div>
        <div style="font-weight:600; font-size:14px;">Messages</div>
        <div style="font-size:13px; opacity:0.8;">Message for Princess</div>
    </div>
</div>

<!-- Lock Screen -->
<div id="lock" class="screen" onclick="openPasscode()"></div>

<!-- Passcode Screen -->
<div id="passcode" class="screen">
    <h2 style="font-weight:400; margin-bottom:10px;">Enter Passcode</h2>
    <div id="dots" style="letter-spacing:10px; font-size:24px; height:30px;"></div>
    <div id="keys"></div>
</div>

<!-- Chat Screen -->
<div id="chat" class="screen"></div>

<!-- Slideshow Screen -->
<div id="slides" class="screen">
    <img id="slideImg" style="width:100%; height:100%; object-fit:cover;">
</div>

<!-- Secret Unlock -->
<div id="secret" class="screen" style="justify-content:center; align-items:center; flex-direction:column;">
    <input type="text" id="nameInput" placeholder="Who is this for?">
    <button onclick="checkName()" style="background:none; border:1px solid white; color:white; padding:8px 20px; border-radius:20px;">Unlock</button>
    <div id="secretText" style="margin-top:20px; font-style:italic; padding: 0 40px;"></div>
</div>

<audio id="music" src="music.mp3" loop></audio>
<audio id="voice" src="voice.mp3"></audio>

<script>
    const state = {
        input: "",
        passcode: "1234",
        messages: [
            "Happy Birthday, Princess...",
            "I didn’t want to just text you.",
            "So I made this instead.",
            "You mattered to me.",
            "And in a quiet way… you still do.",
            "I hope life is being kind to you.",
            "That’s all."
        ],
        msgIndex: 0
    };

    // Update Time
    function updateClock() {
        const d = new Date();
        document.getElementById("time").innerText = d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0");
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Flow Logic
    const notification = document.getElementById('notification');
    notification.onclick = () => {
        notification.style.display = "none";
    };

    function openPasscode() {
        document.getElementById('lock').style.display = "none";
        const pc = document.getElementById('passcode');
        pc.style.display = "flex";
        
        const keysContainer = document.getElementById('keys');
        keysContainer.innerHTML = "";
        [1,2,3,4,5,6,7,8,9,0].forEach(n => {
            const btn = document.createElement('div');
            btn.className = "key";
            btn.innerText = n;
            btn.onclick = () => handlePress(n);
            keysContainer.appendChild(btn);
        });
    }

    function handlePress(n) {
        state.input += n;
        document.getElementById('dots').innerText = "●".repeat(state.input.length);
        
        if(state.input.length === 4) {
            if(state.input === state.passcode) {
                startIntro();
            } else {
                state.input = "";
                document.getElementById('dots').innerText = "";
            }
        }
    }

    function startIntro() {
        document.getElementById('passcode').style.display = "none";
        const intro = document.createElement('div');
        intro.style.cssText = "position:fixed; inset:0; display:flex; justify-content:center; align-items:center; background:black; font-size:24px; font-weight:200; transition: opacity 1s;";
        intro.innerText = "For Princess...";
        document.body.appendChild(intro);

        setTimeout(() => {
            intro.style.opacity = "0";
            setTimeout(() => {
                intro.remove();
                startChat();
            }, 1000);
        }, 2000);
    }

    function startChat() {
        document.getElementById('chat').style.display = "flex";
        document.getElementById('music').play().catch(() => console.log("Audio requires user interaction first"));
        sendNextMessage();
    }

    function sendNextMessage() {
        const chat = document.getElementById('chat');
        if(state.msgIndex < state.messages.length) {
            // Typing indicator
            const typing = document.createElement('div');
            typing.className = "typing";
            typing.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
            chat.appendChild(typing);
            chat.scrollTop = chat.scrollHeight;

            setTimeout(() => {
                typing.remove();
                const b = document.createElement('div');
                b.className = "bubble sent";
                b.innerText = state.messages[state.msgIndex];
                chat.appendChild(b);
                state.msgIndex++;
                chat.scrollTop = chat.scrollHeight;
                setTimeout(sendNextMessage, 1500);
            }, 1000);
        } else {
            setTimeout(startSlides, 2500);
        }
    }

    function startSlides() {
        document.getElementById('chat').style.display = "none";
        const slideScreen = document.getElementById('slides');
        slideScreen.style.display = "block";
        
        const imgs = ["photos/1.jpg", "photos/2.jpg", "photos/3.jpg"];
        let x = 0;
        
        const interval = setInterval(() => {
            document.getElementById('slideImg').src = imgs[x];
            x++;
            if(x >= imgs.length) {
                clearInterval(interval);
                setTimeout(() => {
                    slideScreen.style.display = "none";
                    document.getElementById('secret').style.display = "flex";
                }, 4000);
            }
        }, 4000);
        document.getElementById('slideImg').src = imgs[0]; // Start first
    }

    function checkName() {
        const val = document.getElementById('nameInput').value.toLowerCase();
        if(val === "princess") {
            document.getElementById('voice').play();
            document.getElementById('secretText').innerText = "You found the last part… take care, Princess ❤️";
        }
    }
</script>
</body>
</html>
