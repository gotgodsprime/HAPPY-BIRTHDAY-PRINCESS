<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Quantum Princess 👑</title>

<link rel="stylesheet" href="style.css"/>
</head>

<body>

<div class="bg"></div>

<div id="start">
  <h1>Princess: Quantum Memory</h1>
  <p>Every choice changes the story</p>
  <button onclick="enter()">Begin</button>
</div>

<div id="app">

  <div id="scene" class="scene"></div>

  <div class="choices">
    <button onclick="choose('peace')">Peace 🕊️</button>
    <button onclick="choose('memory')">Memory 🌙</button>
    <button onclick="choose('emotion')">Emotion 💔</button>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
