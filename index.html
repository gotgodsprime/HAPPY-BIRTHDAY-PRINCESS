<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Princess ❤️</title>
<style>
  :root { --glass: rgba(255, 255, 255, 0.1); --border: rgba(255, 255, 255, 0.2); }
  body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #000; color: white; overflow: hidden; display: flex; align-items: center; justify-content: center; height: 100vh; }
  .bg { position: fixed; inset: -10%; background: url('princess.jpg') center/cover no-repeat; filter: blur(30px) brightness(0.2); z-index: -1; }
  .container { width: 85%; max-width: 350px; text-align: center; backdrop-filter: blur(15px); padding: 40px 20px; border-radius: 30px; border: 1px solid var(--border); background: var(--glass); opacity: 0; animation: fadeIn 2s forwards 1s; }
  @keyframes fadeIn { to { opacity: 1; } }
  h1 { font-weight: 300; letter-spacing: 1px; }
  input { background: rgba(255,255,255,0.05); border: 1px solid var(--border); padding: 12px; border-radius: 25px; color: white; text-align: center; margin-top: 20px; width: 80%; outline: none; }
  button { margin-top: 20px; padding: 12px 30px; border-radius: 25px; border: none; background: #fff; color: #000; font-weight: bold; cursor: pointer; transition: 0.3s; }
  button:hover { transform: scale(1.05); }
</style>
</head>
<body>
<div class="bg"></div>
<audio id="music" loop><source src="song.mp3" type="audio/mpeg"></audio>

<div class="container">
  <h1>For You.</h1>
  <p id="typing">A small space for a special day...</p>
  <input type="text" id="nameInput" placeholder="Unlock with your name...">
  <br>
  <button onclick="unlock()">Unlock</button>
</div>

<script>
  function unlock() {
    const val = document.getElementById("nameInput").value.toLowerCase().trim();
    const audio = document.getElementById("music");
    if(val === "princess") {
      audio.play(); 
      localStorage.setItem('musicTime', audio.currentTime);
      document.body.style.transition = "opacity 1.5s";
      document.body.style.opacity = "0";
      setTimeout(() => { window.location.href = "memory.html"; }, 1500);
    }
  }
</script>
</body>
</html>
